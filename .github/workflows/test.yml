name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: docker build -t testbot-platform:ci .

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: [self-hosted, linux, swarm-manager]
    environment: test
    env:
      TESTER_BOT_TOKEN: ${{ secrets.TESTER_BOT_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t testbot-platform:local .
      - run: docker stack deploy --resolve-image never -c docker-stack.yml testbot
