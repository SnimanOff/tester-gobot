services:
  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  child-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tester-bot:
    build: .
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
      CHILD_REDIS_ADDR: child-redis:6379
      CHILD_REDIS_PASSWORD: ""
      CHILD_REDIS_DB: "0"
      CHILD_RUN_UID: "10001"
      CHILD_RUN_GID: "10001"
      CHILDREN_DIR: /app/data/children
    depends_on:
      redis:
        condition: service_healthy
      child-redis:
        condition: service_healthy
    volumes:
      - children-data:/app/data
      - child-go-cache:/var/lib/childbot
    restart: unless-stopped

volumes:
  redis-data:
  children-data:
  child-go-cache:
